<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: История России (Смуты, Войны, Трясения)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-style: italic;
        }

        .question-block {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .question-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .options label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .options label:hover {
            background-color: #f0f8ff;
        }

        .options input[type="radio"] {
            margin-right: 10px;
        }

        button#submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s;
        }

        button#submit-btn:hover {
            background-color: #2980b9;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background-color: #e8f6f3;
            border: 1px solid #a2d9ce;
            border-radius: 5px;
            display: none;
        }

        .explanation {
            margin-top: 5px;
            font-size: 0.9em;
            color: #555;
            font-style: italic;
        }

        .correct {
            color: green;
            font-weight: bold;
        }

        .incorrect {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>История России: Путь через смуты и потрясения</h1>
    <p class="subtitle">Основано на трудах В.О. Ключевского, В.И. Ленина и православной эсхатологии</p>

    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="button" id="submit-btn" onclick="checkResults()">Показать результаты</button>
    </form>

    <div id="result"></div>
</div>

<script>
    // Данные теста на основе предоставленных требований
    const questions = [
        {
            id: 1,
            text: "Согласно В.О. Ключевскому, какая причина лежит в основе Первой Смуты (начало XVII века)?",
            options: [
                "Внешнее вмешательство Польши и Швеции.",
                "Кризис легитимности власти и переориентация земских бояр на новые политические силы, а также экономическое разорение страны.",
                "Божья кара за грехи народа, предсказанная в пророчествах."
            ],
            correct: 1,
            explanation: "Ключевский акцентировал внимание на внутренних социально-политических процессах: кризисе самодержавия и экономическом упадке."
        },
        {
            id: 2,
            text: "С точки зрения марксистской историографии (Ленин), какова роль крестьянских восстаний в Смутное время?",
            options: [
                "Они были стихийными и не имели политического значения.",
                "Они являлись проявлением классовой борьбы, направленной против феодального гнета и крепостничества.",
                "Они были спровоцированы иностранными агентами."
            ],
            correct: 1,
            explanation: "Ленин и марксисты рассматривали историю через призму классовой борьбы."
        },
        {
            id: 3,
            text: "В православной эсхатологии и соборном сознании России, чем объясняется наказание в виде Смуты?",
            options: [
                "Экономическим кризисом и нехваткой ресурсов.",
                "Отступлением от веры и нарушением духовного единства, требующим очищения через страдание.",
                "Недостаточным влиянием церкви на государство."
            ],
            correct: 1,
            explanation: "В религиозном восприятии Смутa часто трактовалась как «боязнь Божья» за грехи."
        },
        {
            id: 4,
            text: "Какой вывод делает Ключевский о роли государства в период после Смуты (воцарение Романовых)?",
            options: [
                "Государство ослабло, уступив власть Земским соборам.",
                "Государство усилило централизацию, чтобы предотвратить новые смуты, опираясь на дворянство.",
                "Государство перешло к демократическим формам правления."
            ],
            correct: 1,
            explanation: "Ключевский отмечал, что уроки Смуты привели к укреплению самодержавия и сословной службы дворянства."
        },
        {
            id: 5,
            text: "По Ленину, какова главная причина Великой Северной войны и экспансии Петра I?",
            options: [
                "Стремление к культурному обновлению страны.",
                "Борьба за выход к морям как экономическую необходимость для развития капитализма и усиление позиции России.",
                "Духовный долг перед Европой."
            ],
            correct: 1,
            explanation: "Ленин рассматривал внешнюю политику через призму экономических интересов и геополитики."
        },
        {
            id: 6,
            text: "Как православная традиция оценивает реформы Петра I с точки зрения духовной преемственности?",
            options: [
                "Как безусловное благо, уравнивающее Россию с Европой.",
                "Как тяжелый выбор между спасением государственности и сохранением древних благочестивых укладов.",
                "Как незначительное событие, не повлиявшее на душу народа."
            ],
            correct: 1,
            explanation: "Многие православные мыслители видели в петровских реформах разрыв между властью и народом."
        },
        {
            id: 7,
            text: "Согласно Ключевскому, что стало катализатором Крестьянской войны под предводительством Пугачева?",
            options: [
                "Влияние иностранных идей.",
                "Усиление крепостного гнета и расширение границ государства на новые территории.",
                "Духовный кризис общества."
            ],
            correct: 1,
            explanation: "Ключевский связывал размах восстания с экспансией на Волгу и Урал."
        },
        {
            id: 8,
            text: "Как Ленин характеризовал роль большевиков в событиях 1917 года?",
            options: [
                "Как стихийный взрыв народного гнева.",
                "Как сознательное действие авангарда пролетариата, использующего кризис империализма.",
                "Как результат заговора элит."
            ],
            correct: 1,
            explanation: "Ключевая идея ленинизма — роль партии как авангарда, организующего стихийное недовольство."
        },
        {
            id: 9,
            text: "В контексте православной эсхатологии, как воспринимается революция 1917 года многими современниками-православными?",
            options: [
                "Как начало нового золотого века.",
                "Как апокалиптическое событие, гонение на Церковь и разрушение «Святой Руси».",
                "Как политический маневр, не имеющий духовного значения."
            ],
            correct: 1,
            explanation: "Для многих священнослужителей большевизм был воспринят как антихристовая сила."
        },
        {
            id: 10,
            text: "Ключевский считал главной движущей силой истории России:",
            options: [
                "Идеологию и политические теории.",
                "Географический фактор, экономические интересы и государственную необходимость.",
                "Религиозные догмы."
            ],
            correct: 1,
            explanation: "В.О. Ключевский — представитель экономического детерминизма."
        },
        {
            id: 11,
            text: "С точки зрения Ленина, почему Первая мировая война была «империалистической»?",
            options: [
                "Потому что воевали православные против католиков.",
                "Потому что она велась за передел сфер влияния и рынков сбыта между капиталистическими державами.",
                "Потому что она была спровоцирована Россией."
            ],
            correct: 1,
            explanation: "Ленин определял Первую мировую как войну империалистического характера."
        },
        {
            id: 12,
            text: "Как православная эсхатология трактует эпоху Сталина (Великую Отечественную войну)?",
            options: [
                "Как период полного отступления Бога.",
                "Как время испытания, где народ проявил соборность и жертвенность, что интерпретируется как духовное очищение.",
                "Как случайный исторический сбой."
            ],
            correct: 1,
            explanation: "Многие современные православные авторы видят в Победе проявление божественного промысла."
        },
        {
            id: 13,
            text: "Ключевский отмечал, что расширение России на восток (Сибирь) шло преимущественно за счет:",
            options: [
                "Военных завоеваний с массовыми убийствами.",
                "Экономического проникновения (ясак) и миграции крестьян/казачества.",
                "Дипломатических договоров."
            ],
            correct: 1,
            explanation: "Ключевский подчеркивал мирный (хотя и колониальный) характер освоения Сибири."
        },
        {
            id: 14,
            text: "По Ленину, какова была главная слабость Временного правительства?",
            options: [
                "Отсутствие военной силы.",
                "Неспособность разрешить ключевые вопросы (земля, мир) и разрыв с интересами масс.",
                "Вмешательство Запада."
            ],
            correct: 1,
            explanation: "Ленин критиковал Временное правительство за то, что оно не могло прекратить войну и дать землю."
        },
        {
            id: 15,
            text: "В православной традиции, что является главной причиной падения любого земного царства?",
            options: [
                "Внешние враги сильнее.",
                "Утрата духовной праведности и справедливости внутри государства.",
                "Экономический кризис."
            ],
            correct: 1,
            explanation: "В русской летописной традиции крах всегда предшествует духовному падению."
        },
        {
            id: 16,
            text: "Ключевский считал, что петровские реформы были успешны, потому что:",
            options: [
                "Они полностью скопировали европейские образцы.",
                "Они соответствовали внутренним потребностям развивающегося государства и были поддержаны дворянством.",
                "Они были навязаны извне."
            ],
            correct: 1,
            explanation: "Ключевский видел в реформах ответ государства на вызовы времени."
        },
        {
            id: 17,
            text: "Ленин в работе «Империализм, как высшая стадия капитализма» указывал на главную особенность России. Что это означало?",
            options: [
                "Россию использовали как рынок для сбыта товаров.",
                "Россию использовали как источник сырья и дешевой рабочей силы, а также как поле для перераспределения капиталов.",
                "Россия была независима от мировой экономики."
            ],
            correct: 1,
            explanation: "Ленин анализировал экономическую зависимость России от иностранных капиталов."
        },
        {
            id: 18,
            text: "Как православная эсхатология относится к идее «Русского мира» в современном контексте?",
            options: [
                "Как к политическому конструкту.",
                "Как к духовно-культурной общности, основанной на общей вере и истории, противостоящей секулярному Западу.",
                "Как к устаревшему понятию."
            ],
            correct: 1,
            explanation: "В публицистике, близкой к православному мировоззрению, «Русский мир» трактуется как цивилизация духовных ценностей."
        },
        {
            id: 19,
            text: "Ключевский отмечал противоречие в истории России между:",
            options: [
                "Севером и Югом.",
                "Государственной необходимостью (собирание земель) и интересами местного населения.",
                "Церковью и Армией."
            ],
            correct: 1,
            explanation: "Это центральное противоречие по Ключевскому: экспансия государства часто вступала в конфликт с жизнью покоренных народов."
        },
        {
            id: 20,
            text: "Согласно синтезу взглядов (Ленин + Эсхатология), какова конечная цель исторического процесса России?",
            options: [
                "Никогда не может быть определена однозначно, но в марксизме — построение коммунизма, в эсхатологии — восстановление Царствия Божия.",
                "Доминирование над Европой.",
                "Возврат к допетровской Руси."
            ],
            correct: 0,
            explanation: "Это вопрос на понимание различия парадигм: материалистической и духовной."
        }
    ];

    // Функция генерации HTML
    function renderQuiz() {
        const container = document.getElementById('questions-container');
        let html = '';

        questions.forEach((q, index) => {
            html += `<div class="question-block" id="q-block-${index}">`;
            html += `<div class="question-title">${index + 1}. ${q.text}</div>`;
            html += `<div class="options">`;

            q.options.forEach((opt, optIndex) => {
                html += `
                    <label>
                        <input type="radio" name="question${index}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            html += `</div>`;
            html += `<div class="explanation" id="expl-${index}" style="display:none;"></div>`;
            html += `</div>`;
        });

        container.innerHTML = html;
    }

    // Функция проверки результатов
    function checkResults() {
        let score = 0;
        let allAnswered = true;

        questions.forEach((q, index) => {
            const selected = document.querySelector(`input[name="question${index}"]:checked`);
            const explDiv = document.getElementById(`expl-${index}`);

            if (!selected) {
                allAnswered = false;
                return;
            }

            const userVal = parseInt(selected.value);

            // Сброс стилей
            explDiv.style.display = 'block';

            if (userVal === q.correct) {
                score++;
                explDiv.innerHTML = `<span class="correct">Верно!</span> <br> ${q.explanation}`;
            } else {
                explDiv.innerHTML = `<span class="incorrect">Неверно.</span> Правильный ответ: ${q.options[q.correct]} <br> ${q.explanation}`;
            }
        });

        if (!allAnswered) {
            alert("Пожалуйста, ответьте на все вопросы перед проверкой.");
            return;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        let message = '';
        if (score >= 18) message = "Отличный результат! Вы глубоко понимаете исторические процессы.";
        else if (score >= 12) message = "Хороший результат. Вы знаете основные вехи, но есть пробелы в теоретической базе.";
        else message = "Стоит повторить материал. История России сложна и многогранна.";

        resultDiv.innerHTML = `<h3>Ваш результат: ${score} из ${questions.length}</h3><p>${message}</p>`;

        // Прокрутка к результату
        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // Инициализация
    renderQuiz();
</script>

</body>
</html>
