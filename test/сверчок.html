<!DOCTYPE html>

            margin: 0;

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.9rem;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            text-align: center;
            color: #4a627a;
            margin-bottom: 32px;
            font-size: 1rem;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 16px;
        }

        .badge-info {
            background: #e9f0f5;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;

        }

        .question-block {
            margin-bottom: 28px;

        .question-title {

        }

        .options label {
            display: flex;

            gap: 10px;

            transition: background 0.2s ease;
            font-weight: 450;
        }

        .options label:hover {
            background-color: #f0f9fa;
        }

        .options input[type="radio"] {
            margin-top: 4px;
            accent-color: var(--accent-color);
            flex-shrink: 0;
        }

        button#submit-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 20px;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        button#submit-btn:hover {
            background-color: #1f6e56;

        }

        #result {
            margin-top: 35px;
            padding: 20px 24px;
            background-color: #eef7f2;
            border-left: 6px solid var(--accent-color);
            border-radius: 20px;

        .explanation {
            margin-top: 12px;
            font-size: 0.9rem;

        }

        @media (max-width: 600px) {

</head>
<body>
<div class="container">

    </div>

    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="button" id="submit-btn">📊 Показать результаты</button>
    </form>
    <div id="result"></div>
</div>

<script>

    // ============================================================

    function renderQuiz() {
        const container = document.getElementById('questions-container');
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-block" id="q-block-${idx}">`;
            html += `<div class="question-title">${idx+1}. ${q.text}</div>`;
            html += `<div class="options">`;
            q.options.forEach((opt, optIdx) => {
                html += `<label><input type="radio" name="q${idx}" value="${optIdx}"> ${opt}</label>`;
            });
            html += `</div><div class="explanation" id="expl-${idx}" style="display:none;"></div></div>`;
        });
        container.innerHTML = html;
    }

    function checkResults() {
        let score = 0;
        let allAnswered = true;

        for (let i = 0; i < questions.length; i++) {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const explDiv = document.getElementById(`expl-${i}`);
            if (!selected) {
                allAnswered = false;
                explDiv.style.display = 'block';
                explDiv.innerHTML = `<span class="incorrect">⚠️ Вопрос без ответа.</span> <br> Чтобы продолжить, выберите вариант.`;
                continue;
            }
            const userVal = parseInt(selected.value);
            explDiv.style.display = 'block';
            if (userVal === questions[i].correct) {
                score++;
                explDiv.innerHTML = `<span class="correct">✓ Верно!</span><br> ${questions[i].explanation}`;
            } else {
                let correctText = questions[i].options[questions[i].correct];
                explDiv.innerHTML = `<span class="incorrect">✗ Неверно.</span> Правильный ответ: ${correctText}<br> ${questions[i].explanation}`;
            }
        }

        if (!allAnswered) {
            alert("Пожалуйста, ответьте на все вопросы теста (включая пропущенные).");
            return;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        let gradeMessage = "";
        if (score >= 18) gradeMessage = "🏆 Блестяще! Вы отлично ориентируетесь в структурах данных и геометрическом ядре Sverchok.";
        else if (score >= 14) gradeMessage = "✅ Хорошо! Знаете как работают кривые, поверхности и вложенные данные, но есть нюансы для изучения.";
        else if (score >= 10) gradeMessage = "📚 Неплохо, но стоит перечитать документацию про NURBS, векторные поля и уровни вложенности.";
        else gradeMessage = "📖 Начните с раздела Data Structure и Introduction to geometry — это база Sverchok. Практикуйтесь!";

        resultDiv.innerHTML = `<div class="result-stats">🎯 Ваш результат: ${score} из ${questions.length}</div>
                               <p>${gradeMessage}</p>
                               <p style="margin-top:8px; font-size:0.9rem;">💡 Советы: изучите «матрешечную» структуру, NURBS-кривые и скалярные поля — ключ к продвинутой процедурной геометрии.</p>`;
        resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    renderQuiz();
    document.getElementById('submit-btn').addEventListener('click', checkResults);
</script>
</body>
</html>
